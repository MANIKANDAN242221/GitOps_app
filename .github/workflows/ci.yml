name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [main]
  workflow_dispatch:

# Don't let two runs bump the GitOps repo at the same time
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 772721871682.dkr.ecr.ap-south-1.amazonaws.com
  ENV_NAME: dev
  GITOPS_REPO: MANIKANDAN242221/GitOps_Argocd
  OVERLAY_PATH: apps/platform-demo/overlays/dev

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. Test backend + build frontend
  # ---------------------------------------------------------------------------
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend - install & test
        working-directory: backend
        run: |
          npm ci
          npm test

      - name: Frontend - install & build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  # ---------------------------------------------------------------------------
  # 2. Build, scan and push Docker images to ECR
  # ---------------------------------------------------------------------------
  build:
    name: Build & Push (${{ matrix.service }})
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # needed for AWS OIDC login
    strategy:
      matrix:
        service: [backend, frontend]
    outputs:
      image_tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag (short commit SHA)
        id: vars
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build once and load locally so Trivy can scan before we push
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          build-args: APP_VERSION=${{ steps.vars.outputs.tag }}
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ENV_NAME }}/${{ matrix.service }}:${{ steps.vars.outputs.tag }}
          load: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.ENV_NAME }}/${{ matrix.service }}:${{ steps.vars.outputs.tag }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"         # fail the pipeline on fixable CRITICAL/HIGH CVEs

      - name: Push image to ECR
        run: docker push "${{ env.ECR_REGISTRY }}/${{ env.ENV_NAME }}/${{ matrix.service }}:${{ steps.vars.outputs.tag }}"

  # ---------------------------------------------------------------------------
  # 3. Update image tag in the GitOps (Argo CD) repo
  # ---------------------------------------------------------------------------
  update-manifests:
    name: Update GitOps repo
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitOps_Argocd repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Set new image tags with kustomize
        working-directory: gitops/${{ env.OVERLAY_PATH }}
        run: |
          TAG="${{ needs.build.outputs.image_tag }}"
          kustomize edit set image backend=${ECR_REGISTRY}/${ENV_NAME}/backend:${TAG}
          kustomize edit set image frontend=${ECR_REGISTRY}/${ENV_NAME}/frontend:${TAG}
          echo "----- updated kustomization.yaml -----"
          cat kustomization.yaml

      - name: Commit and push
        working-directory: gitops
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git add ${{ env.OVERLAY_PATH }}/kustomization.yaml
          git commit -m "ci(${ENV_NAME}): update images to ${{ needs.build.outputs.image_tag }}" \
                     -m "From ${{ github.repository }}@${{ github.sha }}"

          # Retry in case someone else pushed in the meantime
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push failed, retrying ($i)..."
            sleep 5
          done
          exit 1
